name: Build Windows PHP Only

on:
  workflow_dispatch: # يسمح لك بتشغيله يدوياً

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3' # نبقى على 8.3 لأن beast-x تم اختباره عليه
          tools: composer

      - name: Install Composer Dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --ignore-platform-reqs

      - name: Debug YAML Files
        shell: pwsh
        run: |
          Write-Host "--- ext-beastx.yml ---"
          Get-Content config/pkg/ext/ext-beastx.yml
          Write-Host "--- source/beastx.yml ---"
          Get-Content config/pkg/source/beastx.yml

      - name: Build PHP with Swoole and Beast-X
        shell: pwsh
        run: |
          php bin\spc build "beastx,swoole,openssl,curl,mbstring" --build-cli -vvv

      - name: Upload PHP Binary
        uses: actions/upload-artifact@v4
        with:
          name: php-windows-x64
          path: buildroot/bin/php.exe
